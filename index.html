<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0B10">
<title>Happ · CROW</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#0B0B10;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#fff;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
    -webkit-touch-callout:none;
  }

  /* ══════════════════════════════════════════════
     GATE SCREEN
     ══════════════════════════════════════════════ */
  #gate {
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background:radial-gradient(ellipse at 50% 30%, #1a0a12 0%, #0B0B10 65%);
    z-index:50;
    transition:opacity .35s;
    padding:max(env(safe-area-inset-top),20px) 20px max(env(safe-area-inset-bottom),20px);
  }
  #gate.hide { opacity:0; pointer-events:none; }

  .gate-header {
    display:flex; align-items:center; gap:10px;
    padding-bottom:20px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .gate-header .logo {
    width:38px; height:38px; border-radius:10px;
    background:radial-gradient(circle at 40% 35%, #ff6b85, #FF4D6D);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#fff;
    box-shadow:0 4px 16px rgba(255,77,109,.4);
  }
  .gate-header .meta { flex:1; }
  .gate-header .meta .name {
    font-size:15px; font-weight:700; letter-spacing:.05em;
  }
  .gate-header .meta .sub {
    font-size:10px; color:#6a6a72; letter-spacing:.15em; margin-top:2px;
  }

  .gate-body {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
  }

  .ring {
    position:relative; width:200px; height:200px;
    display:flex; align-items:center; justify-content:center;
  }
  
  /* แก้ไข: ใส pointer-events: none; ให้วงกลม เพื่อไม่ให้มันบังการกดปุ่ม */
  .ring::before, .ring::after {
    content:""; position:absolute; border-radius:50%;
    border:1px solid rgba(255,77,109,.25);
    animation:spin 8s linear infinite;
    pointer-events: none; 
  }
  .ring::before { inset:0; }
  .ring::after { inset:16px; border-color:rgba(255,77,109,.15);
    animation-direction:reverse; animation-duration:12s; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #inject {
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #ff6b85, #FF4D6D 60%, #b8002e 100%);
    border:none; color:#fff; font-size:14px; font-weight:800;
    letter-spacing:.22em; cursor:pointer;
    box-shadow:0 0 60px rgba(255,77,109,.55), inset 0 -6px 20px rgba(0,0,0,.3);
    transition:transform .12s;
    position: relative;
    z-index: 10; /* ดันปุ่มขึ้นมาให้อยู่บนสุด */
  }
  #inject:active { transform:scale(.94); }

  .gate-footer {
    display:flex; flex-direction:column; align-items:center;
    gap:6px; padding-top:20px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .gate-footer .status {
    font-size:10px; color:#6a6a72; letter-spacing:.18em;
  }
  .gate-footer .hint {
    font-size:9px; color:#3f3f47; letter-spacing:.12em;
  }

  /* ══════════════════════════════════════════════
     BUBBLE + PANEL
     ══════════════════════════════════════════════ */
  #bubble {
    position:fixed; top:150px; left:14px; width:52px; height:52px;
    border-radius:50%; background:rgba(11,11,16,.94);
    border:2px solid #FF4D6D; display:none;
    align-items:center; justify-content:center;
    font-weight:800; font-size:17px; color:#fff;
    z-index:40; cursor:grab; touch-action:none;
    box-shadow:0 4px 24px rgba(255,77,109,.45);
  }
  #bubble.show { display:flex; }

  #panel {
    position:fixed; top:150px; left:90px; width:250px;
    background:rgba(11,11,16,.96); border:1px solid #FF4D6D;
    border-radius:14px; padding:10px; z-index:41;
    display:none; flex-direction:column; gap:2px;
    backdrop-filter:blur(14px);
    box-shadow:0 12px 48px rgba(0,0,0,.75);
  }
  #panel.show { display:flex; }

  .header {
    display:flex; align-items:center; gap:4px; padding:0 0 8px;
    cursor:grab; touch-action:none;
  }
  .header .title {
    flex:1; font-size:12px; font-weight:800; color:#FF4D6D;
    letter-spacing:.14em;
  }
  .header button {
    width:26px; height:26px; border:none; background:transparent;
    color:#fff; font-size:15px; cursor:pointer; border-radius:6px;
  }
  .header button:active { background:rgba(255,255,255,.1); }

  .divider { height:1px; background:rgba(255,255,255,.12); margin-bottom:4px; }

  .row { display:flex; align-items:center; padding:6px 2px; gap:8px; }
  .row label { flex:1; font-size:11.5px; color:rgba(255,255,255,.9); }

  .sw {
    position:relative; width:36px; height:19px; flex-shrink:0;
    background:#2a2a32; border-radius:20px; cursor:pointer;
    transition:background .18s;
  }
  .sw::after {
    content:""; position:absolute; top:2px; left:2px;
    width:15px; height:15px; border-radius:50%; background:#fff;
    transition:transform .18s;
  }
  .sw.on { background:#FF4D6D; }
  .sw.on::after { transform:translateX(17px); }

  #startBtn {
    margin-top:8px; height:42px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#FF4D6D,#b8002e);
    color:#fff; font-size:12.5px; font-weight:800;
    letter-spacing:.14em; cursor:pointer;
    box-shadow:0 4px 16px rgba(255,77,109,.4);
  }
  #startBtn:active { transform:scale(.98); }

  #toast {
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
    background:rgba(255,77,109,.95); color:#fff; padding:10px 20px;
    border-radius:10px; font-size:12px; letter-spacing:.05em;
    opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:60; white-space:nowrap;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<!-- ═══════ GATE ═══════ -->
<div id="gate">
  <div class="gate-header">
    <div class="logo">C</div>
    <div class="meta">
      <div class="name">CROW</div>
      <div class="sub" id="bridgeStatus">detecting…</div>
    </div>
  </div>

  <div class="gate-body">
    <div class="ring">
      <button id="inject">INJECT</button>
    </div>
  </div>

  <div class="gate-footer">
    <div class="status" id="statusLine">READY</div>
    <div class="hint">tap to load menu</div>
  </div>
</div>

<!-- ═══════ BUBBLE ═══════ -->
<div id="bubble">C</div>

<!-- ═══════ PANEL ═══════ -->
<div id="panel">
  <div class="header" id="dragHandle">
    <div class="title">CROW MENU</div>
    <button id="btnMin">—</button>
    <button id="btnClose">×</button>
  </div>
  <div class="divider"></div>

  <div class="row"><label>Aimbot</label><div class="sw" data-k="aimbot"></div></div>
  <div class="row"><label>Lock Head</label><div class="sw" data-k="lock_head"></div></div>
  <div class="row"><label>Lock Body</label><div class="sw" data-k="lock_body"></div></div>
  <div class="row"><label>ESP / Wallhack</label><div class="sw" data-k="esp"></div></div>
  <div class="row"><label>Instant Revive</label><div class="sw" data-k="instant_revive"></div></div>
  <div class="row"><label>Instant Medkit</label><div class="sw" data-k="instant_medkit"></div></div>
  <div class="row"><label>Headshot</label><div class="sw" data-k="headshot"></div></div>

  <button id="startBtn">START GAME</button>
</div>

<div id="toast"></div>

<script>
(function(){
  'use strict';

  const NAMES = ['Happ','happ','AndroidBridge','Android',
                 'NativeBridge','JSBridge','ModMenu','Native'];
  let BRIDGE = null, BRIDGE_NAME = 'none';
  for (const n of NAMES) {
    const o = window[n];
    if (o && (typeof o === 'object' || typeof o === 'function')) {
      BRIDGE = o; BRIDGE_NAME = n; break;
    }
  }

  function call(fn, ...args) {
    if (BRIDGE && typeof BRIDGE[fn] === 'function') {
      try { return BRIDGE[fn].apply(BRIDGE, args); } catch(_){}
    }
    if (typeof window[fn] === 'function') {
      try { return window[fn](...args); } catch(_){}
    }
    return null;
  }

  const statusEl = document.getElementById('bridgeStatus');
  const statusLine = document.getElementById('statusLine');
  statusEl.textContent = BRIDGE_NAME === 'none'
    ? 'standalone mode'
    : BRIDGE_NAME + ' bridge';
  statusLine.textContent = BRIDGE_NAME === 'none'
    ? 'READY (no bridge)'
    : 'READY · BRIDGE OK';

  const gate = document.getElementById('gate');
  const inject = document.getElementById('inject');
  const bubble = document.getElementById('bubble');
  const panel = document.getElementById('panel');
  const startBtn = document.getElementById('startBtn');
  const btnMin = document.getElementById('btnMin');
  const btnClose = document.getElementById('btnClose');
  const dragHandle = document.getElementById('dragHandle');
  const toastEl = document.getElementById('toast');

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 1600);
    call('toast', msg);
    call('showToast', msg);
  }

  const STORE_KEY = 'crow_state_v1';
  let state = {};
  try { state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(_){ state = {}; }

  function saveState() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(_){}
  }

  /* ══════════════════════════════════════════════
     INJECT → MENU (แก้ให้ปุ่มกดติดชัวร์ๆ)
     ══════════════════════════════════════════════ */
  inject.addEventListener('click', () => {
    console.log('Inject Clicked!');
    
    // ทำให้หน้า Gate หายไปเลย ไม่ให้มาบัง
    gate.style.opacity = '0';
    gate.style.pointerEvents = 'none';
    setTimeout(() => { gate.style.display = 'none'; }, 350);

    bubble.classList.add('show');
    panel.classList.add('show');

    call('onInject');
    call('inject');
    call('menuLoaded');

    if (navigator.vibrate) navigator.vibrate(30);

    toast('injected');
  });

  let bMoved = false, bDown = null;
  bubble.addEventListener('pointerdown', e => {
    bMoved = false;
    bDown = { x: e.clientX, y: e.clientY,
      ox: parseFloat(bubble.style.left||'14'),
      oy: parseFloat(bubble.style.top||'150') };
    bubble.setPointerCapture(e.pointerId);
  });
  bubble.addEventListener('pointermove', e => {
    if (!bDown) return;
    const dx = e.clientX - bDown.x, dy = e.clientY - bDown.y;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) bMoved = true;
    bubble.style.left = (bDown.ox + dx) + 'px';
    bubble.style.top  = (bDown.oy + dy) + 'px';
  });
  bubble.addEventListener('pointerup', () => {
    if (!bMoved) panel.classList.toggle('show');
    bDown = null;
  });

  let drag = null;
  dragHandle.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY,
      ox: parseFloat(panel.style.left||'90'),
      oy: parseFloat(panel.style.top||'150') };
    dragHandle.setPointerCapture(e.pointerId);
  });
  dragHandle.addEventListener('pointermove', e => {
    if (!drag) return;
    panel.style.left = (drag.ox + e.clientX - drag.x) + 'px';
    panel.style.top  = (drag.oy + e.clientY - drag.y) + 'px';
  });
  dragHandle.addEventListener('pointerup', () => drag = null);

  document.querySelectorAll('.sw').forEach(sw => {
    const k = sw.dataset.k;
    if (state[k]) sw.classList.add('on');

    sw.addEventListener('click', () => {
      const on = !sw.classList.contains('on');
      sw.classList.toggle('on', on);
      state[k] = on;
      saveState();

      if (navigator.vibrate) navigator.vibrate(15);

      setTimeout(() => {
        call('setFeature', k, on);
        call('setToggle', k, on);
        call('set', k, on);
        call(k, on);
      }, 80 + Math.random() * 120);
    });
  });

  btnMin.addEventListener('click', () => panel.classList.remove('show'));

  btnClose.addEventListener('click', () => {
    panel.classList.remove('show');
    bubble.classList.remove('show');
    gate.style.display = 'flex'; // คืนค่าหน้า Gate
    setTimeout(() => { gate.style.opacity = '1'; gate.style.pointerEvents = 'auto'; }, 10);
    
    document.querySelectorAll('.sw').forEach(sw => {
      sw.classList.remove('on');
      const k = sw.dataset.k;
      state[k] = false;
      call('setFeature', k, false);
      call('set', k, false);
    });
    saveState();
  });

  const PKG_FF  = 'com.dts.freefireth';
  const PKG_FFM = 'com.dts.freefiremax';

  function launchGame() {
    const bridgeLaunched =
      call('launchGame', PKG_FF) ||
      call('launch', PKG_FF) ||
      call('startGame', PKG_FF) ||
      call('openApp', PKG_FF);

    if (bridgeLaunched) { toast('launching…'); return; }

    toast('launching…');
    try {
      const a = document.createElement('a');
      a.href = 'intent://launch#Intent;scheme=freefire;package=' +
               PKG_FF + ';end';
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => {
        try {
          const b = document.createElement('a');
          b.href = 'intent://launch#Intent;scheme=freefire;package=' +
                   PKG_FFM + ';end';
          document.body.appendChild(b);
          b.click();
          b.remove();
        } catch(_){}
      }, 1500);
    } catch(_) { toast('launch failed'); }
  }

  startBtn.addEventListener('click', launchGame);

  window.addEventListener('message', e => {
    try {
      const d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (d && d.action === 'open')  panel.classList.add('show');
      if (d && d.action === 'close') panel.classList.remove('show');
      if (d && d.action === 'launch') launchGame();
    } catch(_){}
  });

  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        JSON.stringify({ action: 'menuReady', bridge: BRIDGE_NAME }), '*'
      );
    }
  } catch(_){}

  window.addEventListener('orientationchange', () => {
    setTimeout(() => window.scrollTo(0, 0), 100);
  });

  console.log('[crow] bridge:', BRIDGE_NAME, '— ready');
})();
</script>
</body>
</html>
